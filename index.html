<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffe6f0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/hello-kitty.png">
    <title>Nasza lista owo</title>
</head>
<body>

<svg class="ikony-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-bow" viewBox="0 0 24 24">
        <path fill="currentColor" stroke="none" d="M11 9.6C8.6 3.8 1.2 3.6 1.2 10.4c0 6.8 7.4 7.6 9.8 3.6z"/>
        <path fill="currentColor" stroke="none" d="M13 9.6c2.4-5.8 9.8-6 9.8.8 0 6.8-7.4 7.6-9.8 3.6z"/>
        <circle fill="currentColor" stroke="#fff" stroke-width="1.4" cx="12" cy="11.8" r="3.4"/>
    </symbol>
    <symbol id="i-gamepad" viewBox="0 0 24 24">
        <line x1="6" x2="10" y1="11" y2="11"/>
        <line x1="8" x2="8" y1="9" y2="13"/>
        <line x1="15" x2="15.01" y1="12" y2="12"/>
        <line x1="18" x2="18.01" y1="10" y2="10"/>
        <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.544-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
    </symbol>
    <symbol id="i-film" viewBox="0 0 24 24">
        <rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/>
        <line x1="7" x2="7" y1="2" y2="22"/>
        <line x1="17" x2="17" y1="2" y2="22"/>
        <line x1="2" x2="22" y1="12" y2="12"/>
        <line x1="2" x2="7" y1="7" y2="7"/>
        <line x1="2" x2="7" y1="17" y2="17"/>
        <line x1="17" x2="22" y1="17" y2="17"/>
        <line x1="17" x2="22" y1="7" y2="7"/>
    </symbol>
    <symbol id="i-shirt" viewBox="0 0 24 24">
        <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
    </symbol>
    <symbol id="i-todo" viewBox="0 0 24 24">
        <path d="m3 17 2 2 4-4"/>
        <path d="m3 7 2 2 4-4"/>
        <path d="M13 6h8"/>
        <path d="M13 12h8"/>
        <path d="M13 18h8"/>
    </symbol>
    <symbol id="i-all" viewBox="0 0 24 24">
        <rect width="7" height="7" x="3" y="3" rx="2"/>
        <rect width="7" height="7" x="14" y="3" rx="2"/>
        <rect width="7" height="7" x="14" y="14" rx="2"/>
        <rect width="7" height="7" x="3" y="14" rx="2"/>
    </symbol>
    <symbol id="i-flower" viewBox="0 0 24 24">
        <circle cx="12" cy="6.5" r="3.2"/>
        <circle cx="17.5" cy="12" r="3.2"/>
        <circle cx="12" cy="17.5" r="3.2"/>
        <circle cx="6.5" cy="12" r="3.2"/>
        <circle cx="12" cy="12" r="2.2"/>
    </symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24">
        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
        <path d="M20 3v4"/>
        <path d="M22 5h-4"/>
        <path d="M4 17v2"/>
        <path d="M5 18H3"/>
    </symbol>
    <symbol id="i-heart" viewBox="0 0 24 24">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
        <path d="m22 2-7 20-4-9-9-4Z"/>
        <path d="M22 2 11 13"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M5 12h14"/>
        <path d="M12 5v14"/>
    </symbol>
    <symbol id="i-logout" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" x2="9" y1="12" y2="12"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18"/>
        <path d="m6 6 12 12"/>
    </symbol>
</svg>

<div id="modalOverlay"></div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <svg class="ico kokarda modal-kokarda" aria-hidden="true"><use href="#i-bow"/></svg>
    <img class="modal-logo" src="https://www.clipartmax.com/png/full/126-1261994_hello-kitty-png-icon-hello-kitty-png-icons.png" alt="">
    <h2 class="modal-title" id="modalTitle">Nasza checklista OwO</h2>
    <p class="modal-subtitle">Kto się loguje?</p>
    <div class="wybor">
        <label class="wybor-label">
            <input type="radio" name="osoba" value="BK">
            <span class="wybor-card">
                <svg class="ico wybor-ico" aria-hidden="true"><use href="#i-gamepad"/></svg>
                <span>Bartek</span>
            </span>
        </label>
        <label class="wybor-label">
            <input type="radio" name="osoba" value="WW">
            <span class="wybor-card">
                <svg class="ico wybor-ico" aria-hidden="true"><use href="#i-flower"/></svg>
                <span>Wiktoria</span>
            </span>
        </label>
    </div>
    <input type="password" id="hasloInput" placeholder="Hasło..." aria-label="Hasło">
    <button id="modalBtn" class="btn-primary" type="button">
        Wejdź <svg class="ico" aria-hidden="true"><use href="#i-sparkles"/></svg>
    </button>
</div>

<header class="navbar" id="navbar">
    <img class="navbar-logo" src="https://www.clipartmax.com/png/full/126-1261994_hello-kitty-png-icon-hello-kitty-png-icons.png" alt="">
    <h1 class="navbar-title">
        Nasza lista
        <span class="navbar-owo">OwO</span>
        <svg class="ico kokarda navbar-kokarda" aria-hidden="true"><use href="#i-bow"/></svg>
    </h1>
    <div id="navButtons" class="nav-actions" hidden>
        <span class="user-chip">
            <span class="user-chip-ico">
                <svg class="ico" aria-hidden="true"><use id="userChipIco" href="#i-gamepad"/></svg>
            </span>
            <span id="userChipName"></span>
        </span>
        <button id="logoutBtn" class="logout-btn" type="button" aria-label="Wyloguj">
            <svg class="ico" aria-hidden="true"><use href="#i-logout"/></svg>
            <span class="logout-txt">Wyloguj</span>
        </button>
    </div>
</header>

<main class="main-content">

    <section class="card add-card" aria-labelledby="addTitle">
        <h2 class="card-title" id="addTitle">
            <svg class="ico kokarda" aria-hidden="true"><use href="#i-bow"/></svg>
            Co dodajemy?
        </h2>

        <div class="kat-picker" role="radiogroup" aria-label="Kategoria">
            <label class="kat-tile" data-kat="gra">
                <input type="radio" name="kategoria" value="gra" checked>
                <span class="kat-tile-body">
                    <span class="kat-ico"><svg class="ico" aria-hidden="true"><use href="#i-gamepad"/></svg></span>
                    <span class="kat-tile-label">Gra</span>
                </span>
            </label>
            <label class="kat-tile" data-kat="film">
                <input type="radio" name="kategoria" value="film">
                <span class="kat-tile-body">
                    <span class="kat-ico"><svg class="ico" aria-hidden="true"><use href="#i-film"/></svg></span>
                    <span class="kat-tile-label">Film</span>
                </span>
            </label>
            <label class="kat-tile" data-kat="cosplay">
                <input type="radio" name="kategoria" value="cosplay">
                <span class="kat-tile-body">
                    <span class="kat-ico"><svg class="ico" aria-hidden="true"><use href="#i-shirt"/></svg></span>
                    <span class="kat-tile-label">Cosplay</span>
                </span>
            </label>
            <label class="kat-tile" data-kat="todo">
                <input type="radio" name="kategoria" value="todo">
                <span class="kat-tile-body">
                    <span class="kat-ico"><svg class="ico" aria-hidden="true"><use href="#i-todo"/></svg></span>
                    <span class="kat-tile-label">To-Do</span>
                </span>
            </label>
        </div>

        <div class="dla-kogo" id="dlaKogo" hidden>
            <span class="dla-kogo-label">Dla kogo?</span>
            <div class="segmented" role="radiogroup" aria-label="Dla kogo">
                <label>
                    <input type="radio" name="dlaKogo" value="ja" checked>
                    <span><svg class="ico" aria-hidden="true"><use href="#i-heart"/></svg>Dla mnie</span>
                </label>
                <label>
                    <input type="radio" name="dlaKogo" value="prosba">
                    <span><svg class="ico" aria-hidden="true"><use href="#i-send"/></svg><span id="prosbaLabel">Prośba</span></span>
                </label>
            </div>
        </div>

        <form class="add-row" id="addForm" autocomplete="off">
            <input type="text" id="nazwaInput" placeholder="Tytuł gry..." aria-label="Nazwa">
            <button type="submit" class="btn-primary" id="addBtn">
                <svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg>
                <span id="addBtnLabel">Dodaj grę</span>
            </button>
        </form>
    </section>

    <nav class="filtry" aria-label="Filtruj listy">
        <span class="filtry-label">Pokaż:</span>
        <button type="button" class="filtr active" data-filtr="wszystko" aria-pressed="true">
            <svg class="ico" aria-hidden="true"><use href="#i-all"/></svg>Wszystko
            <span class="filtr-licznik" data-licznik="wszystko">0</span>
        </button>
        <button type="button" class="filtr" data-filtr="gra" data-kat="gra" aria-pressed="false">
            <svg class="ico" aria-hidden="true"><use href="#i-gamepad"/></svg>Gry
            <span class="filtr-licznik" data-licznik="gra">0</span>
        </button>
        <button type="button" class="filtr" data-filtr="film" data-kat="film" aria-pressed="false">
            <svg class="ico" aria-hidden="true"><use href="#i-film"/></svg>Filmy
            <span class="filtr-licznik" data-licznik="film">0</span>
        </button>
        <button type="button" class="filtr" data-filtr="cosplay" data-kat="cosplay" aria-pressed="false">
            <svg class="ico" aria-hidden="true"><use href="#i-shirt"/></svg>Cosplay
            <span class="filtr-licznik" data-licznik="cosplay">0</span>
        </button>
        <button type="button" class="filtr" data-filtr="todo" data-kat="todo" aria-pressed="false">
            <svg class="ico" aria-hidden="true"><use href="#i-todo"/></svg>To-Do
            <span class="filtr-licznik" data-licznik="todo">0</span>
        </button>
    </nav>

    <div class="lists-row">
        <section class="card list-card" aria-labelledby="tytulBK">
            <h2 class="list-title" id="tytulBK">
                <span class="osoba-ico"><svg class="ico" aria-hidden="true"><use href="#i-gamepad"/></svg></span>
                Bartek
                <span class="licznik" id="licznikBK">0</span>
            </h2>
            <div id="listaBK" class="items-container"><p class="ladowanie">Ładuję…</p></div>
        </section>
        <section class="card list-card" aria-labelledby="tytulWW">
            <h2 class="list-title" id="tytulWW">
                <span class="osoba-ico"><svg class="ico" aria-hidden="true"><use href="#i-flower"/></svg></span>
                Wiktoria
                <span class="licznik" id="licznikWW">0</span>
            </h2>
            <div id="listaWW" class="items-container"><p class="ladowanie">Ładuję…</p></div>
        </section>
    </div>

</main>

<script type="module" src="script.js"></script>
</body>
</html>
